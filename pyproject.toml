[project]
name = "zem"
version = "0.1.0"
description = "A modular AI-driven content generation and discovery platform"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.0.10",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "redis>=5.0.0",
    "alembic>=1.12.0",
    "asyncpraw>=7.7.1",
    "beautifulsoup4>=4.12.0",
    "rapidfuzz>=3.0.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",
    "argparse"
]
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "db*", "shared*"]
