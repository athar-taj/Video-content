services:
  redis:
    image: redis:7-alpine
    container_name: zem_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zem_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zem_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - zem_network

  worker:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: zem_app:latest
    container_name: zem_worker
    restart: always
    command: python ai/workflows/workers/rabbitmq_worker.py --queue general_queue
    env_file:
      - ../../.env
    environment:
      - REDIS_HOST=redis
      # Connect database to the host machine's local PostgreSQL instance
      - POSTGRES_HOST=host.docker.internal
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:5432/${POSTGRES_DB:-zem_db}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../assets:/app/assets
      - ../../logs:/app/logs
    depends_on:
      - redis
      - rabbitmq
    networks:
      - zem_network

  render_worker:
    image: zem_app:latest
    container_name: zem_render_worker
    restart: always
    command: python ai/workflows/workers/rabbitmq_worker.py --queue render_queue
    env_file:
      - ../../.env
    environment:
      - REDIS_HOST=redis
      # Connect database to the host machine's local PostgreSQL instance
      - POSTGRES_HOST=host.docker.internal
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:5432/${POSTGRES_DB:-zem_db}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../assets:/app/assets
      - ../../logs:/app/logs
    depends_on:
      - redis
      - worker
      - rabbitmq
    networks:
      - zem_network

networks:
  zem_network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
